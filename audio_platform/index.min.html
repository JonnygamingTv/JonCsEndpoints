<!doctypehtml><html lang=en><meta charset=UTF-8><meta content="width=device-width,initial-scale=1"name=viewport><title>MusicStore</title><style>:root{--bg:#0d0f14;--s:#161a24;--a:#a78bfa;--t:#e2e4ed;--sub:#8b8fa8;--ok:#4caf7d;--err:#e05c5c}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--t);font-family:system-ui,sans-serif;min-height:100vh}nav{display:flex;align-items:center;gap:1rem;padding:.8rem 2rem;background:var(--s);border-bottom:1px solid #222}nav strong{color:var(--a);font-size:1.1rem;margin-right:auto}nav a{color:var(--sub);text-decoration:none;font-size:.9rem}nav a:hover{color:var(--t)}.btn{background:var(--a);color:#fff;border:none;border-radius:8px;padding:.55rem 1.4rem;font-size:.9rem;cursor:pointer;transition:opacity .15s}.btn:hover{opacity:.85}.btn.ghost{background:0 0;border:1px solid var(--a);color:var(--a)}.page{display:none;padding:2rem;max-width:1100px;margin:0 auto}.page.active{display:block}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:1.2rem;margin-top:1.5rem}.card{background:var(--s);border-radius:12px;overflow:hidden;cursor:pointer;transition:transform .15s}.card:hover{transform:translateY(-3px)}.card img{width:100%;aspect-ratio:1;object-fit:cover;background:#1a1d27}.card-body{padding:.75rem}.card-title{font-size:.9rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card-artist{font-size:.78rem;color:var(--sub);margin-top:.2rem}.card-price{font-size:.82rem;color:var(--a);margin-top:.4rem}#player-bar{position:fixed;bottom:0;left:0;right:0;background:var(--s);border-top:1px solid #222;padding:.75rem 2rem;display:none;align-items:center;gap:1rem}#player-bar audio{flex:1}#player-title{font-size:.85rem;min-width:160px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.form-card{background:var(--s);border-radius:16px;padding:2rem;max-width:480px;margin:2rem auto}label{display:block;font-size:.82rem;color:var(--sub);margin-bottom:.3rem}input,select,textarea{width:100%;background:var(--bg);color:var(--t);border:1px solid #333;border-radius:8px;padding:.6rem;font-size:.9rem;margin-bottom:1rem}textarea{resize:vertical;min-height:80px}.err-msg{color:var(--err);font-size:.82rem;margin-bottom:.75rem;min-height:1.1em}.sort-bar{display:flex;gap:.5rem;margin-top:1rem}.sort-bar button{background:var(--s);color:var(--sub);border:1px solid #333;border-radius:6px;padding:.4rem .9rem;cursor:pointer;font-size:.82rem}.sort-bar button.active{border-color:var(--a);color:var(--a)}progress{width:100%;height:6px;accent-color:var(--a);margin-bottom:1rem;display:none}</style><nav><strong>🎵 MusicStore</strong> <a href=# onclick='showPage("browse")'>Browse</a> <a href=# onclick='showPage("upload")'id=nav-upload style=display:none>Upload</a> <a href=# onclick='showPage("dashboard")'id=nav-dash style=display:none>My Library</a> <span id=nav-credits style=color:var(--sub);font-size:.82rem;display:none></span> <button onclick='showPage("login")'class="btn ghost"id=nav-login-btn>Login</button> <button onclick=logout() class="btn ghost"style=display:none id=nav-logout-btn>Logout</button></nav><div class="page active"id=page-browse><h2 style=margin-bottom:.5rem>Discover Music</h2><div class=sort-bar><button onclick='setSort("new",this)'class=active>New</button> <button onclick='setSort("top",this)'>Top Played</button> <button onclick='setSort("promoted",this)'>Featured</button></div><div class=grid id=browse-grid></div><div style=text-align:center;margin-top:1.5rem><button onclick=loadMore() class="btn ghost"id=load-more-btn>Load more</button></div></div><div class=page id=page-login><div class=form-card><h2 style=margin-bottom:1.2rem id=auth-title>Login</h2><div class=err-msg id=auth-err></div><label>Email</label> <input id=auth-email placeholder=you@example.com type=email> <label>Password</label> <input id=auth-pass placeholder=•••••••• type=password><div id=reg-extra style=display:none><label>Artist name (optional)</label> <input id=auth-artist placeholder="Your artist name"></div><button onclick=doAuth() class=btn style=width:100%;margin-bottom:.75rem>Continue</button> <button onclick=toggleAuthMode() class="btn ghost"style=width:100%><span id=auth-toggle-txt>Don't have an account? Register</span></button></div></div><div class=page id=page-upload><div class=form-card style=max-width:560px><h2 style=margin-bottom:1.2rem>Upload Track</h2><a href=/artist>Dashboard</a><div class=err-msg id=upload-err></div><label>Audio file (WAV / MP3 / FLAC / OGG — max 500 MB)</label> <input id=upload-file type=file accept=.wav,.mp3,.flac,.ogg,.aiff> <label>Title</label> <input id=upload-title placeholder="Track title"maxlength=100> <label>Description</label> <textarea id=upload-desc placeholder="Tell listeners about this track…"></textarea> <label>Price (cents, 0 = free)</label> <input id=upload-price type=number min=0 value=0><progress id=upload-prog></progress><button onclick=doUpload() class=btn style=width:100%>Upload & Publish</button></div></div><div class=page id=page-dashboard><h2 style=margin-bottom:1.2rem>My Library</h2><div class=grid id=library-list></div></div><div id=player-bar><div id=player-title>—</div><audio controls id=audio-el preload=none></audio></div><script>const _ME={id:0,email:1,artist:2,credits:3,is_mod:4,owned:5},B={id:0,title:1,artist:2,price:3,plays:4,hw:5,promo:6};let me=null,browsePage=0,browseSort="new";async function fetchMe(){try{const e=await fetch("/m/me");if(!e.ok)return;me=await e.json(),document.getElementById("nav-upload").style.display="inline",document.getElementById("nav-dash").style.display="inline",document.getElementById("nav-credits").style.display="inline",document.getElementById("nav-credits").textContent=`💳 ${(me[_ME.credits]/100).toFixed(2)}`,document.getElementById("nav-login-btn").style.display="none",document.getElementById("nav-logout-btn").style.display="inline",loadLib()}catch(e){console.error(e)}}async function fetchInfo(e){try{const t=await fetch("/m/track?id="+e);return t.ok?t.json():void 0}catch(e){console.error(e)}return null}async function loadLib(){try{var n=me[_ME.owned];let t=[];for(let e=0;e<n.length;e++){var o=await fetchInfo(n[e]);o&&t.push(o)}renderCards2(t,document.getElementById("library-list"))}catch(e){console.error(e)}}(async()=>{await fetchMe(),await loadBrowse()})();let isRegMode=!1;function toggleAuthMode(){isRegMode=!isRegMode,document.getElementById("auth-title").textContent=isRegMode?"Register":"Login",document.getElementById("auth-toggle-txt").textContent=isRegMode?"Already have an account? Login":"Don't have an account? Register",document.getElementById("reg-extra").style.display=isRegMode?"block":"none"}async function doAuth(){var e=document.getElementById("auth-email").value.trim(),t=document.getElementById("auth-pass").value,n=document.getElementById("auth-artist").value.trim();const o=document.getElementById("auth-err");var a=isRegMode?"/m/register":"/m/login",t=isRegMode?{email:e,password:t,artistName:n||void 0}:{email:e,password:t};const d=await fetch(a,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(t)});t=await d.json();d.ok?(o.textContent="",await fetchMe(),showPage("browse")):o.textContent=t.e||"Error"}async function logout(){await fetch("/m/logout",{method:"POST"}),me=null,location.reload()}async function loadBrowse(e=!0){e&&(browsePage=0,document.getElementById("browse-grid").innerHTML="");const t=await fetch(`/m/browse?page=${browsePage}&sort=${browseSort}`);e=(await t.json())[2];renderCards(e),document.getElementById("load-more-btn").style.display=e.length<24?"none":"inline-block"}function loadMore(){browsePage++,loadBrowse(!1)}function setSort(e,t){browseSort=e,document.querySelectorAll(".sort-bar button").forEach(e=>e.classList.remove("active")),t.classList.add("active"),loadBrowse()}function renderCards(e){const t=document.getElementById("browse-grid");for(const n of e){const o=document.createElement("div");o.className="card",o.innerHTML=`
      <img src="/m/icon?id=${n[B.id]}" loading="lazy" alt="">
      <div class="card-body">
        <div class="card-title">${esc(n[B.title])}</div>
        <div class="card-artist">${esc(n[B.artist]||"Unknown")}</div>
        <div class="card-price">
          ${0===n[B.price]?"Free":"$"+(n[B.price]/100).toFixed(2)}
          ${n[B.hw]?" · WAV":""}
          ${n[B.promo]?" ⭐":""}
        </div>
      </div>`,o.onclick=()=>openTrackPage(n[0]),t.appendChild(o)}}function renderCards2(t,n){for(let e=0;e<t.length;e++){const o=t[e],a=document.createElement("div");a.className="card",a.innerHTML=`
      <img src="/m/icon?id=${o[0]}" loading="lazy" alt="">
      <div class="card-body">
        <div class="card-title">${esc(o[1])}</div>
        <div class="card-artist">${esc(o[7]||"Unknown")}</div>
        <div class="card-price">${0===o[3]?"Free":"$"+(o[3]/100).toFixed(2)}
          ${o[5]?" · WAV":""}</div>
      </div>`,a.onclick=()=>openTrack(o),n.appendChild(a)}}function openTrackPage(e){return window.open("/track?id="+e)}async function openTrack(e){const t=document.getElementById("player-bar"),n=document.getElementById("audio-el");document.getElementById("player-title").textContent=`${e[1]} — ${e[7]||"Unknown"}`,n.src=`/m/stream?id=${e[0]}`,t.style.display="flex",n.play()}function updateCreditsDisplay(){me&&(document.getElementById("nav-credits").textContent=`💳 ${(me[_ME.credits]/100).toFixed(2)}`)}function doUpload(){var e=document.getElementById("upload-file").files[0],t=document.getElementById("upload-title").value.trim(),n=document.getElementById("upload-desc").value.trim(),o=parseInt(document.getElementById("upload-price").value)||0;const a=document.getElementById("upload-err"),d=document.getElementById("upload-prog");if(e&&t){const i=new FormData;i.append("file",e),i.append("title",t),i.append("description",n),i.append("price",o);const r=new XMLHttpRequest;r.upload.onprogress=e=>{e.lengthComputable&&(d.style.display="block",d.value=e.loaded/e.total*100)},r.onload=async()=>{var e;d.style.display="none",200===r.status?(e=JSON.parse(r.responseText),a.textContent="",alert(`Track uploaded! ID: ${e.audioId} — processing in background.`),showPage("browse")):a.textContent=JSON.parse(r.responseText).e||"Upload failed"},r.onerror=()=>{a.textContent="Network error"},r.open("POST","/m/upload"),r.send(i)}else a.textContent="File and title required"}function showPage(e){document.querySelectorAll(".page").forEach(e=>e.classList.remove("active")),document.getElementById("page-"+e)?.classList.add("active")}function esc(e){return String(e).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}</script>
